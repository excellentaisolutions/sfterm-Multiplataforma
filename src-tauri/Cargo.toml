[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
portable-pty = "0.9.0"
git2 = "0.21.0"
notify = "8.2.0"
toml_edit = "0.25.5"
sysinfo = "0.36.1"
dirs = "6.0.0"
ignore = "0.4.28"
toml = "1.0.7"
vte = "0.15"
unicode-width = "0.2"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
font-kit = "0.14.3"
libc = "0.2.186"
objc2 = "0.6.4"
objc2-web-kit = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Wry is used directly for the unprivileged agent browser.  Unlike a Tauri
# webview it has no IPC handler, so arbitrary pages never receive a bridge to
# application commands.  Keep this aligned with the version already selected
# by the Tauri runtime.
wry = "0.55.1"
webview2-com = "0.38.2"
base64 = "0.22.1"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
