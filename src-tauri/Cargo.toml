[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
portable-pty = "0.9.0"
git2 = "0.21.0"
notify = "8.2.0"
toml_edit = "0.25.5"
sysinfo = "0.36.1"
dirs = "6.0.0"
font-kit = "0.14.3"
ignore = "0.4.28"
libc = "0.2.186"
toml = "1.0.7"
objc2 = "0.6.4"
objc2-web-kit = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
vte = "0.15"
unicode-width = "0.2"
tauri-plugin-single-instance = "2.4.3"
