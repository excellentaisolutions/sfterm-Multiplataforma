name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep each gate separate so a platform-specific failure is immediately
      # attributable from the Actions job without downloading private logs.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  native-macos:
    name: Native (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: node scripts/check-platform-boundaries.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: node scripts/check-platform-boundaries.mjs
      - run: npm run test:shell:windows
      - run: npm run test:process-tree:windows
      - run: npm run test:ptyd-primitives:windows
      - name: Install pinned agent CLIs for ConPTY smoke tests
        run: npm install --global @anthropic-ai/claude-code@2.1.220 @openai/codex@0.146.0
      - name: Persistent daemon E2E
        timeout-minutes: 3
        run: npm run test:ptyd-e2e:windows
      - name: Cargo check
        timeout-minutes: 15
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        env:
          SFTERM_REAL_TUI_MATRIX: "1"
